<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STW Block Manager Analytics V1.1.9</title><link rel="stylesheet" href="assets/styles.css"></head><body><aside><div class="brand"><b>STW</b><div><strong>Block Manager</strong><span>Analytics V1.1.9 · SQLite</span></div></div><nav><button data-view="overview">Visão geral</button><button data-view="dns" class="active">DNS Dashboard</button><button data-view="dnsreport">Relatório DNS</button><button data-view="firewall">Firewall Dashboard</button><button data-view="fwreport">Relatório Firewall</button><button data-view="history">Histórico local</button><button data-view="about">Sobre</button></nav><div class="local">● 100% LOCAL<br><small>SQLite · sem acesso ao pfSense</small></div></aside><main><header><div><h1 id="title">DNS Dashboard</h1><p id="subtitle">Métricas e relatórios preservados do Block Manager</p></div><div class="actions"><button id="import" class="primary">Importar CSV</button><button onclick="window.print()">Imprimir / PDF</button></div></header><section class="statusbar"><div><span id="statusDot" class="dot wait"></span><b id="statusText">VERIFICANDO</b><small id="statusDetail">Validando base SQLite...</small></div><div><b id="lastUpdate">Sem importação</b><small>Última atualização</small></div><div><b id="dbCounts">0 DNS · 0 Firewall</b><small>Eventos armazenados</small></div></section><section id="filters"><label>Data inicial<input id="from" type="date"></label><label>Hora inicial<input id="from_time" type="time" value="00:00"></label><label>Data final<input id="to" type="date"></label><label>Hora final<input id="to_time" type="time" value="23:59"></label><label>Grupo<input id="group"></label><label>Ação<select id="action"><option value="">Todas</option></select></label><label class="dns-filter">Dispositivo histórico<input id="device" placeholder="Nome gravado no evento"></label><label class="dns-filter">IP histórico<input id="ip" placeholder="192.168.1.50"></label><label class="dns-filter">MAC histórico<input id="mac" placeholder="74:86:7A:FD:33:22"></label><label class="dns-filter">Domínio<input id="domain"></label><label class="fw-filter">Origem<input id="source" placeholder="Host, usuário, IP ou porta"></label><label class="fw-filter">Destino<input id="destination" placeholder="IP, porta ou serviço"></label><label class="fw-filter">Serviço<input id="service"></label><label class="fw-filter">Categoria<input id="category"></label><label class="fw-filter">Porta<input id="port"></label><div class="report-actions"><button id="apply" class="primary">Gerar relatório</button><button id="export">Exportar CSV</button><button id="printReport">Visualizar relatório completo</button><button id="clear">Limpar filtros</button></div></section><div id="notice"></div><section id="content"></section></main><script src="app.js"></script></body></html>
